[project]
name = "rpacq"
version = "0.1.0"
description = "Official implementation of RPACQ for EEG-based cross-subject emotion recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "awkward>=2.9.0",
    "einops>=0.8.2",
    "loguru>=0.7.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "torch~=2.8.0",
    "typer>=0.21.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
